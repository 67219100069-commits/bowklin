<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบแอดมิน — พ.ร.บ.คอมพิวเตอร์อัจฉริยะ</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="auth-page">

<div class="auth-bg" aria-hidden="true">
  <div class="auth-bg__grid"></div>
</div>

<main class="auth-card">

  <div class="mascot" id="mascot">
    <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- antenna -->
      <line x1="60" y1="8" x2="60" y2="20" stroke="var(--signal-blue)" stroke-width="3" stroke-linecap="round"/>
      <circle class="mascot__antenna-dot" cx="60" cy="6" r="5" fill="var(--signal-green)"/>
      <!-- head -->
      <rect x="18" y="20" width="84" height="70" rx="20" fill="var(--bg-elevated)" stroke="var(--border-strong)" stroke-width="2"/>
      <!-- ears -->
      <rect x="6" y="42" width="12" height="24" rx="6" fill="var(--bg-elevated)" stroke="var(--border-strong)" stroke-width="2"/>
      <rect x="102" y="42" width="12" height="24" rx="6" fill="var(--bg-elevated)" stroke="var(--border-strong)" stroke-width="2"/>

      <!-- === EYES: normal (blinking) === -->
      <g class="mascot__eyes mascot__eyes--normal">
        <circle class="mascot__eye" cx="44" cy="54" r="7" fill="var(--signal-green)"/>
        <circle class="mascot__eye" cx="76" cy="54" r="7" fill="var(--signal-green)"/>
      </g>

      <!-- === EYES: happy (^ ^) === -->
      <g class="mascot__eyes mascot__eyes--happy">
        <path d="M37 56q7-9 14 0" stroke="var(--signal-green)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M69 56q7-9 14 0" stroke="var(--signal-green)" stroke-width="4" stroke-linecap="round" fill="none"/>
      </g>

      <!-- === EYES: sad/error (x x) === -->
      <g class="mascot__eyes mascot__eyes--sad">
        <path d="M38 48l12 12M50 48L38 60" stroke="var(--signal-red)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M70 48l12 12M82 48L70 60" stroke="var(--signal-red)" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <!-- mouth -->
      <rect class="mascot__mouth" x="50" y="70" width="20" height="6" rx="3" fill="var(--border-strong)"/>
    </svg>
  </div>

  <h1 class="auth-title">สวัสดีเจ้าของเว็บ 👋</h1>
  <p class="auth-sub">เข้าสู่ระบบ หรือสมัครเป็นแอดมินคนแรกของเว็บนี้</p>

  <div class="auth-tabs" role="tablist">
    <button type="button" class="auth-tab is-active" id="tabLogin" role="tab" aria-selected="true">เข้าสู่ระบบ</button>
    <button type="button" class="auth-tab" id="tabRegister" role="tab" aria-selected="false">สมัครสมาชิก</button>
  </div>

  <form id="loginForm" novalidate>
    <label class="field-label" for="loginEmail">อีเมล</label>
    <div class="input-wrap">
      <input
        type="email"
        id="loginEmail"
        placeholder="you@example.com"
        autocomplete="username"
        required
      >
    </div>

    <label class="field-label" for="loginPassword">รหัสผ่าน</label>
    <div class="input-wrap">
      <input
        type="password"
        id="loginPassword"
        placeholder="••••••••"
        autocomplete="current-password"
        required
      >
      <button type="button" class="input-eye" data-toggle-password aria-label="แสดง/ซ่อนรหัสผ่าน">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
    </div>

    <button type="submit" class="btn btn--primary btn--full" id="loginBtn">
      <span id="loginBtnText">เข้าสู่ระบบ</span>
    </button>
  </form>

  <form id="registerForm" novalidate hidden>
    <label class="field-label" for="registerEmail">อีเมล</label>
    <div class="input-wrap">
      <input
        type="email"
        id="registerEmail"
        placeholder="you@example.com"
        autocomplete="username"
        required
      >
    </div>

    <label class="field-label" for="registerPassword">รหัสผ่าน</label>
    <div class="input-wrap">
      <input
        type="password"
        id="registerPassword"
        placeholder="อย่างน้อย 6 ตัวอักษร"
        autocomplete="new-password"
        minlength="6"
        required
      >
      <button type="button" class="input-eye" data-toggle-password aria-label="แสดง/ซ่อนรหัสผ่าน">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
    </div>

    <label class="field-label" for="registerConfirm">ยืนยันรหัสผ่าน</label>
    <div class="input-wrap">
      <input
        type="password"
        id="registerConfirm"
        placeholder="พิมพ์รหัสผ่านอีกครั้ง"
        autocomplete="new-password"
        minlength="6"
        required
      >
    </div>

    <button type="submit" class="btn btn--primary btn--full" id="registerBtn">
      <span id="registerBtnText">สมัครสมาชิก</span>
    </button>
  </form>

  <p class="auth-error" id="authError" role="alert" hidden></p>

  <a href="index.html" class="auth-back">← กลับหน้าเว็บไซต์หลัก</a>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
